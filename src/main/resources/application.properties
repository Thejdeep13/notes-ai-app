# ---- Database (MySQL). Override with environment variables. ----
spring.datasource.url=jdbc:mysql://localhost:3306/notesdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- JWT ----
# Use a long random value (32+ characters) in real deployments.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
jwt.expiration-ms=86400000

# ---- AI (Claude API). Never hard-code the key. ----
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# ---- Misc ----
server.port=8080
server.error.include-message=always
